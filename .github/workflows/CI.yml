name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
  lint:
    runs-on: ubuntu-latest
    -steps:
      - uses: action/checkout@v7
      - uses: action/setup-go@v7
        with: go-version: '1.23'
        cache: false
      
      -name: gofmt
      -run: |
        unform=$(gofmt -l .)
        if [-n "$unform"]; then;
          echo "::error::Files are not formatted"
          echo "$unform"
          exit 1
        fi

        -name: govet
        -run: govet ./...

        -name: golangcilint
        - uses: golangci/golang-cilint-action@v9
        with:
          version: latest
        
      
        
